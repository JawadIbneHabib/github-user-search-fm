<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon-32x32.png" />

        <title>Frontend Mentor | GitHub user search app</title>
        <style>
            body {
                font-family: "Space Mono", monospace;
                background-color: #f6f8ff;
                color: #4b6a9b;
                display: flex;
                flex-direction: column;
                align-items: center;
                margin: 0;
            }
            .logo {
                margin-top: 20px;
                display: flex;
                justify-content: space-between;
                width: 100%;
            }
            .top-menu {
                display: flex;
                margin-top: 20px;
                background-color: white;
                padding: 3px;
                width: 100%;
                justify-content: space-between;
                position: relative;
            }
            .top-menu img {
                width: 20px;
                height: 20px;
                position: absolute;
                top: 50%;
                left: 25px;
                transform: translate(-50%, -50%);
            }
            #search-input {
                padding: 10px;
                border: none;
                border-radius: 4px;
                width: 100%;
                margin-left: 35px;
            }
            #search-input:focus {
                outline: none;
            }
            #search-button {
                padding: 10px 20px;
                margin-left: 10px;
                background-color: #007bff;
                color: white;
                border: none;
                border-radius: 4px;
                cursor: pointer;
            }
            .main-part {
                width: 80%;
                max-width: 600px;
                border-radius: 8px;
            }
            .username-join h1,
            .username-join p {
                margin: 0;
            }
            .info {
                display: flex;
                justify-content: space-between;
                margin-top: 20px;
                background-color: white;
            }
            .info-item {
                text-align: center;
            }
            .bottom-menu {
                display: flex;
                justify-content: space-around;
                margin-top: 20px;
                width: 80%;
                max-width: 600px;
            }
            .div {
                width: 100%;
                max-width: 800px;
                margin: 0 auto;
                display: flex;
                background-color: #e2e4eb;
                margin-top: 20px;
                padding: 20px;
            }
            .div2 {
                width: 100%;
                max-width: 800px;
                margin: 0 auto;
                display: flex;
                align-items: center;
                background-color: #e2e4eb;
                flex-direction: column;
                padding: 20px;
            }
            .name-date-holder {
                display: flex;
                justify-content: space-between;
                align-items: center;
            }
            img.avatar {
                width: 120px;
                height: 120px;
                border-radius: 50%;
                margin-right: 20px;
            }
        </style>
    </head>
    <body>
        <div class="div2">
            <div class="logo">
                <p>devfinder</p>
                <button>Dark</button>
            </div>

            <div class="top-menu">
                <img src="/assets/icon-search.svg" alt="" />
                <input type="text" placeholder="Search GitHub username..." id="search-input" />
                <button id="search-button">Search</button>
            </div>
        </div>
        <div class="div">
            <img
                src="https://upload.wikimedia.org/wikipedia/commons/8/89/Portrait_Placeholder.png?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=original"
                alt="User Avatar"
                class="avatar"
            />
            <div class="main-part">
                <div class="username-join">
                    <div class="name-date-holder">
                        <h1 id="username">The Octocat</h1>
                        <p id="join-date">405- 405</p>
                    </div>
                    <p id="user-bio"></p>
                    <p id="user-github-blog"></p>
                </div>
                <div class="info">
                    <div class="info-item">
                        <p>Repos</p>
                        <h2 id="user-repos">0</h2>
                    </div>
                    <div class="info-item">
                        <p>Followers</p>
                        <h2 id="user-followers">0</h2>
                    </div>
                    <div class="info-item">
                        <p>Following</p>
                        <h2 id="user-following">0</h2>
                    </div>
                </div>
                <div class="bottom-menu">
                    <p id="user-location">Location</p>
                    <p id="user-twitter">twitter</p>
                    <p id="user-github-blog">git blog</p>
                    <p id="user-company">company</p>
                </div>
            </div>
        </div>
    </body>
    <script src="script.js" defer></script>
</html>
